# Browser security headers for the app and the /api/ responses.
#
# One file, included by the server block AND by every static location that sets
# its own header (Cache-Control). nginx's add_header does not merge: a location
# with any add_header of its own drops every server-level one, so a location that
# adds Cache-Control without including this file would serve the app with no CSP
# or HSTS. Keeping the set here means the copies cannot drift apart.
#
# The attachment locations in nginx.conf.template deliberately declare their own,
# different set (framing for the preview, CORS for the Office viewer) and must not
# include this file.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: https://view.officeapps.live.com; frame-ancestors 'none';" always;

# Deny every powerful browser feature we don't use; voice mode needs the mic
# (same-origin only), nothing else (camera/geolocation/payment/usb/sensors) is used.
add_header Permissions-Policy "geolocation=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), microphone=(self)" always;

# Cross-origin isolation (Spectre-class / window.opener hardening). The
# attachments locations re-declare their own add_header set, so CORP
# intentionally never reaches /attachments/public/ (that stays cross-origin for
# the Office viewer). COOP same-origin would sever window.opener for popup
# OAuth — revisit (→ same-origin-allow-popups) if/when OIDC popups land.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
